; PlatformIO Project Configuration File for ESP32 Digital Clock
[platformio]
default_envs = esp32dev
src_dir = src
build_dir = C:/tmp/esp32_build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/RTClib @ ^2.1.3

build_flags =
    -D CORE_DEBUG_LEVEL=3
